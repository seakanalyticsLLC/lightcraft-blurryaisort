[package]
name = "lightcraft-blur"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft Blur Cull (L1): BlurNet subject-blur model (candle, CPU), safe weights reader and subject scoring"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }

# The network runs natively only; the web build gets scoring helpers and a clear "unsupported" error.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
candle-core = { workspace = true }

[dev-dependencies]
# tests record why they skip (`cargo xtask ci` lists the skips)
lightcraft-testkit = { workspace = true }
